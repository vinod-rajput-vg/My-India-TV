name: Apply channel card 376x288

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Set channel cards to 376x288') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update ChannelView card geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()\n        val rowHeight = cw + rowGap'''
          new = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()\n        val cardHeight = cw * 288f / 376f\n        val rowHeight = cardHeight + rowGap'''
          if s.count(old) != 3:
              raise SystemExit(f'Expected 3 ChannelView geometry blocks, found {s.count(old)}')
          s = s.replace(old, new)
          old = '''                    val r = RectF(left, topPos, left + cw, topPos + cw)'''
          new = '''                    val r = RectF(left, topPos, left + cw, topPos + cardHeight)'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected 1 channel card rect, found {s.count(old)}')
          s = s.replace(old, new)
          old = '''        val itemBottom = itemTop + cw + dp(26f)'''
          new = '''        val itemBottom = itemTop + cardHeight + dp(26f)'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected 1 selected-item bottom expression, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          git rm .github/workflows/apply-channel-card-376x288.yml
          git commit -m "Set channel cards to 376x288"
          git push
