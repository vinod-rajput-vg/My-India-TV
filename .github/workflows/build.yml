name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recover MainActivity and remove Star Movies channels
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/myindiatv/MainActivity.kt"

          # Recover the known-good source from before the accidental truncation.
          if [ "$(wc -c < "$FILE")" -lt 10000 ]; then
            curl -fsSL "https://raw.githubusercontent.com/vinod-rajput-vg/My-India-TV/7fd488b3a311916af651f7e5f37463bbbf5626ed/$FILE" -o "$FILE"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/myindiatv/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          # Remove Star Movies and Star Movies Select channel entries.
          text = re.sub(r'^\s*Channel\("Star Movies(?: Select)?",[^\n]*\n', '', text, flags=re.MULTILINE)

          # Keep exactly 5 category columns. Additional categories start on the next row.
          old_draw = '''        val side = dp(38f)
        val gap = dp(16f)
        val top = dp(95f)
        val cw = (width - side * 2 - gap * 5) / 6f
        repeat(6) { i ->
            val left = side + i * (cw + gap)
            val r = RectF(left, top, left + cw, top + cw)'''
          new_draw = '''        val columns = 5
        val side = dp(38f)
        val gap = dp(16f)
        val rowGap = dp(85f)
        val top = dp(95f)
        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        repeat(names.size) { i ->
            val row = i / columns
            val column = i % columns
            val left = side + column * (cw + gap)
            val cardTop = top + row * (cw + rowGap)
            val r = RectF(left, cardTop, left + cw, cardTop + cw)'''
          if old_draw not in text:
              raise SystemExit("Expected category grid block was not found")
          text = text.replace(old_draw, new_draw, 1)

          old_keys = '''        when (k) {
            KeyEvent.KEYCODE_DPAD_LEFT -> { selected = (selected + names.size - 1) % names.size; postInvalidateOnAnimation(); return true }
            KeyEvent.KEYCODE_DPAD_RIGHT -> { selected = (selected + 1) % names.size; postInvalidateOnAnimation(); return true }
            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }
            KeyEvent.KEYCODE_MENU -> { settings = true; postInvalidateOnAnimation(); return true }'''
          new_keys = '''        when (k) {
            KeyEvent.KEYCODE_DPAD_LEFT -> {
                if (selected % 5 > 0) selected--
                postInvalidateOnAnimation()
                return true
            }
            KeyEvent.KEYCODE_DPAD_RIGHT -> {
                if (selected % 5 < 4 && selected + 1 < names.size) selected++
                postInvalidateOnAnimation()
                return true
            }
            KeyEvent.KEYCODE_DPAD_UP -> {
                if (selected - 5 >= 0) selected -= 5
                postInvalidateOnAnimation()
                return true
            }
            KeyEvent.KEYCODE_DPAD_DOWN -> {
                if (selected + 5 < names.size) selected += 5
                postInvalidateOnAnimation()
                return true
            }
            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }
            KeyEvent.KEYCODE_MENU -> { settings = true; postInvalidateOnAnimation(); return true }'''
          if old_keys not in text:
              raise SystemExit("Expected category D-pad block was not found")
          text = text.replace(old_keys, new_keys, 1)

          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- "$FILE"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Set category grid to 5 columns"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error