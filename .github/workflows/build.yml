name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recover MainActivity and remove Star Movies channels
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/myindiatv/MainActivity.kt"

          # Recover the known-good source from before the accidental truncation.
          if [ "$(wc -c < "$FILE")" -lt 10000 ]; then
            curl -fsSL "https://raw.githubusercontent.com/vinod-rajput-vg/My-India-TV/7fd488b3a311916af651f7e5f37463bbbf5626ed/$FILE" -o "$FILE"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/myindiatv/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'^\s*Channel\("Star Movies(?: Select)?",[^\n]*\n', '', text, flags=re.MULTILINE)
          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- "$FILE"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Remove Star Movies Select from channel list"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
