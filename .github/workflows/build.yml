name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
