name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply home grid spacing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/myindiatv/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          old = "val rowGap = dp(150f)"
          new = "val rowGap = dp(70f)"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "val rowGap = dp(70f)" not in text:
              raise SystemExit("Home grid rowGap declaration was not found")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if [ -f .github/workflows/fix-home-grid-spacing-once.yml ]; then
            git rm .github/workflows/fix-home-grid-spacing-once.yml
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Fix home category second-row spacing"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
