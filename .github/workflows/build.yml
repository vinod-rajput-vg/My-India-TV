name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove Colors Cineplex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("app/src/main/java/com/myindiatv/MainActivity.kt"),
              Path("Cataogories/Entertainment.txt"),
              Path("app/src/main/assets/entertainment_channels.txt"),
          ]

          patterns = [
              re.compile(r'\n?\s*Channel\("Colors Cineplex",\s*"http://149\.71\.34\.166:8000/play/a036/index\.m3u8",\s*iconResId = iconId\("colors_cineplex"\)\),\s*'),
              re.compile(r'\n?Colors Cineplex\nhttp://149\.71\.34\.166:8000/play/a036/index\.m3u8\n[^\n]*Colors_Cineplex\.png\n?'),
              re.compile(r'\n?Colors Cineplex\nhttp://149\.71\.34\.166:8000/play/a036/index\.m3u8\n?'),
          ]

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for pattern in patterns:
                  updated = pattern.sub("\n", updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          icon = Path("app/src/main/res/ch-drawable-nodpi/colors_cineplex.png")
          if icon.exists():
              icon.unlink()
          PY

          if git diff --quiet; then
            echo "Colors Cineplex already removed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Colors Cineplex"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
