name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply category grid fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/myindiatv/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          old_grid = '''        val cw = (width - side * 2 - gap * 5) / 6f
          repeat(6) { i ->
              val left = side + i * (cw + gap)
              val r = RectF(left, top, left + cw, top + cw)'''

          new_grid = '''        val columns = 5
          val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
          repeat(names.size) { i ->
              val row = i / columns
              val column = i % columns
              val left = side + column * (cw + gap)
              val topPos = top + row * (cw + gap)
              val r = RectF(left, topPos, left + cw, topPos + cw)'''

          if old_grid not in text:
              raise SystemExit("Expected 6-column category grid block was not found")
          text = text.replace(old_grid, new_grid, 1)

          old_key = '''            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }'''

          new_key = '''            KeyEvent.KEYCODE_DPAD_DOWN -> { if (selected + 5 < names.size) selected += 5; postInvalidateOnAnimation(); return true }
              KeyEvent.KEYCODE_DPAD_UP -> { if (selected - 5 >= 0) selected -= 5; postInvalidateOnAnimation(); return true }
              KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }'''

          if old_key not in text:
              raise SystemExit("Expected category D-pad handler was not found")
          text = text.replace(old_key, new_key, 1)

          path.write_text(text, encoding="utf-8")
          print("Category grid fixed: 5 columns with additional categories on the next row.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
