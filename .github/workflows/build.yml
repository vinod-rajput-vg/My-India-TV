name: Build My India TV Debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply category grid fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/myindiatv/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          # Convert the HomeView category layout from 6 columns to 5 columns.
          old_cw = "val cw = (width - side * 2 - gap * 5) / 6f"
          if old_cw in text:
              text = text.replace(
                  old_cw,
                  "val columns = 5\n        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()",
                  1,
              )

          old_repeat = "repeat(6) { i ->"
          if old_repeat in text:
              text = text.replace(old_repeat, "repeat(names.size) { i ->", 1)

          old_left = "val left = side + i * (cw + gap)"
          if old_left in text:
              text = text.replace(
                  old_left,
                  "val row = i / columns\n            val column = i % columns\n            val left = side + column * (cw + gap)\n            val topPos = top + row * (cw + gap)",
                  1,
              )

          old_rect = "val r = RectF(left, top, left + cw, top + cw)"
          if old_rect in text:
              text = text.replace(old_rect, "val r = RectF(left, topPos, left + cw, topPos + cw)", 1)

          # Add vertical D-pad navigation for the second row.
          center = "KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }"
          if "KeyEvent.KEYCODE_DPAD_DOWN ->" not in text and center in text:
              replacement = (
                  "KeyEvent.KEYCODE_DPAD_DOWN -> { if (selected + 5 < names.size) selected += 5; postInvalidateOnAnimation(); return true }\n"
                  "            KeyEvent.KEYCODE_DPAD_UP -> { if (selected - 5 >= 0) selected -= 5; postInvalidateOnAnimation(); return true }\n"
                  + center
              )
              text = text.replace(center, replacement, 1)

          if "val columns = 5" not in text:
              raise SystemExit("Category grid replacement failed: columns declaration not found")
          if "val topPos = top + row * (cw + gap)" not in text:
              raise SystemExit("Category grid replacement failed: row positioning not found")
          if "KeyEvent.KEYCODE_DPAD_DOWN ->" not in text:
              raise SystemExit("Category grid replacement failed: D-pad row navigation not found")

          path.write_text(text, encoding="utf-8")
          print("Category grid fixed successfully: 5 columns, remaining categories continue on the next row.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: My-India-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
