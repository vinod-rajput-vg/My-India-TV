name: Sort Kids Channels

# Triggered after the workflow was corrected to target category index 4.
# The workflow only watches its own file, so its MainActivity commit does not loop.

on:
  push:
    paths:
      - '.github/workflows/sort-kids-channels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Kids channel order
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          expected = [
              'Nick Hindi',
              'Pogo Hindi',
              'Sonic Hindi',
              'Cartoon Network Hindi',
              'Cartoon Network HD Plus Hindi',
              'Discovery Kids Hindi',
              'Hungama',
              'Super Hungama',
              'Disney Channel',
          ]

          # Kids is category index 4 in the current home menu.
          # Match to the next category/else branch, not to following methods.
          pattern = r'(?ms)^(\s*)4\s*->\s*listOf\((.*?)^\s*(?=5\s*->|else\s*->)'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit('Kids category (4 -> listOf) not found; no changes made.')

          indent = match.group(1)
          block = match.group(2)

          def find_channel(name):
              for line in block.splitlines():
                  if re.search(rf'Channel\("{re.escape(name)}"\s*,', line):
                      return line.strip()
              return None

          ordered_lines = []
          used_names = set()
          for name in expected:
              line = find_channel(name)
              if line is None:
                  raise SystemExit(f'Kids channel not found: {name}')
              ordered_lines.append(indent + '    ' + line)
              used_names.add(name)

          for line in block.splitlines():
              channel_match = re.search(r'Channel\("([^"]+)"\s*,', line)
              if not channel_match:
                  continue
              name = channel_match.group(1)
              if name in used_names:
                  continue
              ordered_lines.append(indent + '    ' + line.strip())

          replacement = indent + '4 -> listOf(\n' + ',\n'.join(ordered_lines) + '\n' + indent + ')\n'
          updated = text[:match.start()] + replacement + text[match.end():]

          if updated == text:
              print('Kids channel order is already correct.')
          else:
              path.write_text(updated, encoding='utf-8')
              print('Kids category reordered successfully.')

      - name: Verify order
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path('app/src/main/java/com/myindiatv/MainActivity.kt').read_text(encoding='utf-8')
          pattern = r'(?ms)^\s*4\s*->\s*listOf\((.*?)^\s*(?=5\s*->|else\s*->)'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit('Kids category (4 -> listOf) not found during verification.')

          block = match.group(1)
          expected = [
              'Nick Hindi', 'Pogo Hindi', 'Sonic Hindi',
              'Cartoon Network Hindi', 'Cartoon Network HD Plus Hindi',
              'Discovery Kids Hindi', 'Hungama', 'Super Hungama', 'Disney Channel'
          ]

          positions = []
          for name in expected:
              pos = block.find(f'Channel("{name}"')
              if pos < 0:
                  raise SystemExit(f'Kids channel missing during verification: {name}')
              positions.append(pos)

          if positions != sorted(positions):
              raise SystemExit('Kids channel order verification failed.')

          print('Kids channel order verified.')

      - name: Commit sorted order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Kids channel order is already correct."
            exit 0
          fi
          git commit -m "Sort Kids category channels"
          git push
