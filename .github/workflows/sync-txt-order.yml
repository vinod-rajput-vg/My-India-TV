name: Auto TXT Update
on:
  workflow_run:
    workflows: ["main-workflow"]
    types: [completed]

jobs:
  retry:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    permissions:
      actions: write
    steps:
      - name: Wait 5 minutes
        run: sleep 300

      - name: Re-run all jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run rerun "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.event.repository.full_name }}"   


permissions:
  contents: write

concurrency:
  group: sync-channel-txt-order
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Firebase Admin SDK
        run: python -m pip install --disable-pip-version-check firebase-admin

      - name: Sync Firestore channel data into category TXT files
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_txt_order.py
