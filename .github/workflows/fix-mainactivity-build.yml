name: Fix MainActivity Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix nullable ChannelView usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text()
          old = '        channelView = ChannelView(this, index)\n        setContentView(channelView)\n        channelView?.requestFocus()'
          new = '        val view = ChannelView(this, index)\n        channelView = view\n        setContentView(view)\n        view.requestFocus()'
          if old not in text:
              raise SystemExit('Expected openCategory block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify source change
        shell: bash
        run: |
          set -euo pipefail
          grep -A7 -B1 'fun openCategory' app/src/main/java/com/myindiatv/MainActivity.kt

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-mainactivity-build.yml
          git add app/src/main/java/com/myindiatv/MainActivity.kt .github/workflows/fix-mainactivity-build.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MainActivity build error'
          git push
