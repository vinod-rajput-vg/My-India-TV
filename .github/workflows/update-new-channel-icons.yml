name: Update new channel icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply icon mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          s = p.read_text()
          replacements = {
              'Channel("Star Gold", "http://51.75.127.199:3141/stargold/index.m3u8", iconResId = 0)': 'Channel("Star Gold", "http://51.75.127.199:3141/stargold/index.m3u8", iconResId = iconId("star_gold"))',
              'Channel("Star Utsav Movies", "http://51.75.127.199:3141/starutsavmovies/index.m3u8", iconResId = 0)': 'Channel("Star Utsav Movies", "http://51.75.127.199:3141/starutsavmovies/index.m3u8", iconResId = iconId("star_utsav_movies"))',
              'Channel("Zee Classic", "http://107.167.16.138/zeeclassic/index.m3u8?token=test", iconResId = 0)': 'Channel("Zee Classic", "http://107.167.16.138/zeeclassic/index.m3u8?token=test", iconResId = iconId("zeeclassic"))',
              'Channel("Colors Cineplex", "https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/gb/YuppTV/ColorsCineplexUK.m3u8", iconResId = 0)': 'Channel("Colors Cineplex", "https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/gb/YuppTV/ColorsCineplexUK.m3u8", iconResId = iconId("colors_cineplex"))',
              'Channel("Colors Cineplex HD", "http://51.75.127.199:3141/colorscineplexhd/index.m3u8", iconResId = 0)': 'Channel("Colors Cineplex HD", "http://51.75.127.199:3141/colorscineplexhd/index.m3u8", iconResId = iconId("colors_cineplex_hd"))',
              'Channel("Colors Cineplex Superhits", "http://51.75.127.199:3141/colorscineplexsuperhit/index.m3u8", iconResId = 0)': 'Channel("Colors Cineplex Superhits", "http://51.75.127.199:3141/colorscineplexsuperhit/index.m3u8", iconResId = iconId("colors_cineplex_superhits"))',
              'Channel("National Geographic", "http://51.75.127.199:3141/natgeo/index.m3u8", iconResId = 0)': 'Channel("National Geographic", "http://51.75.127.199:3141/natgeo/index.m3u8", iconResId = iconId("national_geographic"))',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected channel entry: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          git rm .github/workflows/update-new-channel-icons.yml
          git commit -m 'Add icons for newly added channels'
          git push
