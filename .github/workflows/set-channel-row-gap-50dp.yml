name: Set channel row-to-row gap to 50dp

on:
  push:
    paths:
      - '.github/workflows/set-channel-row-gap-50dp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change ChannelView row gap only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          marker = 'private class ChannelView(context: Context, categoryIndex: Int) : View(context) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('ChannelView declaration not found.')

          head = text[:start]
          tail = text[start:]

          old = 'val rowGap = dp(30f)'
          new = 'val rowGap = dp(50f)'
          count = tail.count(old)
          if count == 0:
              if new in tail:
                  print('ChannelView row gap is already 50dp.')
                  raise SystemExit(0)
              raise SystemExit('ChannelView rowGap = 30dp was not found.')

          tail = tail.replace(old, new)
          path.write_text(head + tail, encoding='utf-8')
          print(f'Changed {count} ChannelView rowGap declaration(s) from 30dp to 50dp.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m 'Change channel row gap to 50dp'
          git push
