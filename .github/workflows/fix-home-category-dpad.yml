name: Fix Home Category DPAD Navigation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Apply DPAD navigation fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/myindiatv/MainActivity.kt"); s=p.read_text(encoding="utf-8"); old="    private var selected = 0\n"; new="    private val columns = 5\n    private var selected = 0\n"; assert old in s, "selected property not found"; s=s.replace(old,new,1); s=s.replace("        val columns = 5\n", "", 1); old2="""            KeyEvent.KEYCODE_DPAD_LEFT -> { selected = (selected + names.size - 1) % names.size; postInvalidateOnAnimation(); return true }\n            KeyEvent.KEYCODE_DPAD_RIGHT -> { selected = (selected + 1) % names.size; postInvalidateOnAnimation(); return true }\n            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }\n"""; new2="""            KeyEvent.KEYCODE_DPAD_LEFT -> { selected = (selected + names.size - 1) % names.size; postInvalidateOnAnimation(); return true }\n            KeyEvent.KEYCODE_DPAD_RIGHT -> { selected = (selected + 1) % names.size; postInvalidateOnAnimation(); return true }\n            KeyEvent.KEYCODE_DPAD_UP -> { val previous = selected - columns; if (previous >= 0) selected = previous; postInvalidateOnAnimation(); return true }\n            KeyEvent.KEYCODE_DPAD_DOWN -> { val next = selected + columns; if (next < names.size) selected = next; postInvalidateOnAnimation(); return true }\n            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { (context as? MainActivity)?.openCategory(selected); return true }\n"""; assert old2 in s, "DPAD navigation block not found"; s=s.replace(old2,new2,1); p.write_text(s,encoding="utf-8")'

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private val columns = 5' app/src/main/java/com/myindiatv/MainActivity.kt
          grep -q 'KEYCODE_DPAD_UP' app/src/main/java/com/myindiatv/MainActivity.kt
          grep -q 'KEYCODE_DPAD_DOWN' app/src/main/java/com/myindiatv/MainActivity.kt

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          rm -f .github/workflows/fix-home-category-dpad.yml
          git add -A .github/workflows/fix-home-category-dpad.yml
          git commit -m "Fix home category up down navigation"
          git push origin HEAD:main
