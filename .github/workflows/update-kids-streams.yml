name: Update Kids category stream URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Kids stream URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'http://51.75.127.199:3141/sonichindi/index.m3u8': 'http://202.70.146.135:8000/play/a02t/index.m3u8',
              'http://51.75.127.199:3141/pogohindi/index.m3u8': 'http://27.116.22.53:5001/live/559.m3u8',
              'http://51.75.127.199:3141/cartoonnetworkhindi/index.m3u8': 'http://27.116.22.53:5001/live/816.m3u8',
              'http://51.75.127.199:3141/cartoonnetworkhdplus/index.m3u8': 'http://27.116.22.53:5001/live/3436.m3u8',
              'http://27.116.22.53:5001/live/3452.m3u8': 'http://27.116.22.53:5001/live/554.m3u8',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected URL: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myindiatv/MainActivity.kt .github/workflows/update-kids-streams.yml
          git rm .github/workflows/update-kids-streams.yml
          git commit -m "Update Kids category stream URLs"
          git push
