name: Fix channel card size and icon rendering

on:
  push:
    paths:
      - '.github/workflows/fix-channel-icon-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply channel card and icon rendering fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          marker = 'private class ChannelView(context: Context, categoryIndex: Int) : View(context) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('ChannelView declaration not found.')

          head = text[:start]
          tail = text[start:]

          old_row = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val rowHeight = cw + rowGap'''
          new_row = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val cardHeight = cw
        val rowHeight = cardHeight + rowGap'''

          if old_row in tail:
              tail = tail.replace(old_row, new_row, 1)
          elif '        val cardHeight = cw\n        val rowHeight = cardHeight + rowGap' not in tail:
              raise SystemExit('Expected ChannelView row sizing block not found.')

          old_rect = '''                    val r = RectF(left, topPos, left + cw, topPos + cw)'''
          new_rect = '''                    val r = RectF(left, topPos, left + cw, topPos + cardHeight)'''
          if old_rect in tail:
              tail = tail.replace(old_rect, new_rect, 1)

          old_icon = '''                        val safe = RectF(r.left + dp(5f), r.top + dp(5f), r.right - dp(5f), r.bottom - dp(5f))
                        val targetAspect = 376f / 288f
                        var targetWidth = safe.width()
                        var targetHeight = targetWidth / targetAspect
                        if (targetHeight > safe.height()) {
                            targetHeight = safe.height()
                            targetWidth = targetHeight * targetAspect
                        }
                        val dst = RectF(
                            safe.centerX() - targetWidth / 2,
                            safe.centerY() - targetHeight / 2,
                            safe.centerX() + targetWidth / 2,
                            safe.centerY() + targetHeight / 2
                        )'''
          new_icon = '''                        val safe = RectF(r.left + dp(12f), r.top + dp(12f), r.right - dp(12f), r.bottom - dp(12f))
                        val targetAspect = 376f / 288f
                        var targetWidth = safe.width()
                        var targetHeight = targetWidth / targetAspect
                        if (targetHeight > safe.height()) {
                            targetHeight = safe.height()
                            targetWidth = targetHeight * targetAspect
                        }
                        val dst = RectF(
                            safe.centerX() - targetWidth / 2,
                            safe.centerY() - targetHeight / 2,
                            safe.centerX() + targetWidth / 2,
                            safe.centerY() + targetHeight / 2
                        )'''

          if old_icon in tail:
              tail = tail.replace(old_icon, new_icon, 1)
          elif 'val targetAspect = 376f / 288f' not in tail:
              raise SystemExit('Expected channel icon rendering block not found.')

          path.write_text(head + tail, encoding='utf-8')
          print('Applied square channel cards and safe 376x288 icon rendering.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix channel card size and icon rendering'
          git push
