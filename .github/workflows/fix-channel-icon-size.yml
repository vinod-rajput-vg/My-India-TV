name: Fix channel icon aspect ratio

on:
  push:
    paths:
      - '.github/workflows/fix-channel-icon-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 376x288 channel icon ratio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''(?P<indent>\s*)val safe = RectF\(r\.left \+ dp\(5f\), r\.top \+ dp\(5f\), r\.right - dp\(5f\), r\.bottom - dp\(5f\)\)\n'''
              r'''\s*val scale = minOf\(safe\.width\(\) / bitmap\.width\.toFloat\(\), safe\.height\(\) / bitmap\.height\.toFloat\(\)\) \* 1\.08f\n'''
              r'''\s*val w = bitmap\.width \* scale\n'''
              r'''\s*val h = bitmap\.height \* scale\n'''
              r'''\s*val dst = RectF\(safe\.centerX\(\) - w / 2, safe\.centerY\(\) - h / 2, safe\.centerX\(\) \+ w / 2, safe\.centerY\(\) \+ h / 2\)\n'''
              r'''\s*c\.save\(\)\n'''
              r'''\s*c\.clipPath\(Path\(\)\.apply \{ addRoundRect\(r, dp\(24f\), dp\(24f\), Path\.Direction\.CW\) \}\)\n'''
              r'''\s*c\.drawBitmap\(bitmap, null, dst, iconPaint\)\n'''
              r'''\s*c\.restore\(\)'''
          )

          replacement = '''{indent}val safe = RectF(r.left + dp(5f), r.top + dp(5f), r.right - dp(5f), r.bottom - dp(5f))
          {indent}val targetAspect = 376f / 288f
          {indent}var targetWidth = safe.width()
          {indent}var targetHeight = targetWidth / targetAspect
          {indent}if (targetHeight > safe.height()) {{
          {indent}    targetHeight = safe.height()
          {indent}    targetWidth = targetHeight * targetAspect
          {indent}}}
          {indent}val dst = RectF(
          {indent}    safe.centerX() - targetWidth / 2,
          {indent}    safe.centerY() - targetHeight / 2,
          {indent}    safe.centerX() + targetWidth / 2,
          {indent}    safe.centerY() + targetHeight / 2
          {indent})
          
          {indent}val sourceAspect = bitmap.width.toFloat() / bitmap.height.toFloat()
          {indent}val src: Rect
          {indent}if (sourceAspect > targetAspect) {{
          {indent}    val srcWidth = (bitmap.height * targetAspect).toInt().coerceAtLeast(1)
          {indent}    val leftCrop = ((bitmap.width - srcWidth) / 2).coerceAtLeast(0)
          {indent}    src = Rect(leftCrop, 0, (leftCrop + srcWidth).coerceAtMost(bitmap.width), bitmap.height)
          {indent}}} else {{
          {indent}    val srcHeight = (bitmap.width / targetAspect).toInt().coerceAtLeast(1)
          {indent}    val topCrop = ((bitmap.height - srcHeight) / 2).coerceAtLeast(0)
          {indent}    src = Rect(0, topCrop, bitmap.width, (topCrop + srcHeight).coerceAtMost(bitmap.height))
          {indent}}}
          
          {indent}c.save()
          {indent}c.clipPath(Path().apply {{ addRoundRect(r, dp(24f), dp(24f), Path.Direction.CW) }})
          {indent}c.drawBitmap(bitmap, src, dst, iconPaint)
          {indent}c.restore()'''

          match = pattern.search(text)
          if not match:
              raise SystemExit('Expected channel icon drawing block was not found; no changes made.')

          new_text = replacement.format(indent=match.group('indent'))
          text = text[:match.start()] + new_text + text[match.end():]
          path.write_text(text, encoding='utf-8')
          print('Applied 376x288 channel icon ratio.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix channel icons to 376x288 aspect ratio'
          git push
