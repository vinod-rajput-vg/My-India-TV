name: Fix channel card size and icon rendering

# Applies the channel-card-only 376:288 layout while preserving each icon's native aspect ratio.
on:
  push:
    paths:
      - '.github/workflows/fix-channel-icon-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 376x288 channel cards and preserve icon appearance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          marker = 'private class ChannelView(context: Context, categoryIndex: Int) : View(context) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('ChannelView declaration not found.')

          head = text[:start]
          tail = text[start:]

          # Only the channel card/column aspect ratio is changed to 376:288.
          # Category cards and all other sizing remain untouched.
          old_square = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val cardHeight = cw
        val rowHeight = cardHeight + rowGap'''
          new_ratio = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val cardHeight = cw * (288f / 376f)
        val rowHeight = cardHeight + rowGap'''

          old_ratio = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val cardHeight = cw * 288f / 376f
        val rowHeight = cardHeight + rowGap'''

          if old_square in tail:
              tail = tail.replace(old_square, new_ratio, 1)
          elif old_ratio not in tail:
              raise SystemExit('Expected ChannelView row sizing block not found.')

          # Keep every channel icon's own aspect ratio. Do not force/stretch
          # icons to 376:288; only the card itself uses that ratio.
          old_forced_icon = '''                        val safe = RectF(r.left + dp(12f), r.top + dp(12f), r.right - dp(12f), r.bottom - dp(12f))
                        val targetAspect = 376f / 288f
                        var targetWidth = safe.width()
                        var targetHeight = targetWidth / targetAspect
                        if (targetHeight > safe.height()) {
                            targetHeight = safe.height()
                            targetWidth = targetHeight * targetAspect
                        }
                        val dst = RectF(
                            safe.centerX() - targetWidth / 2,
                            safe.centerY() - targetHeight / 2,
                            safe.centerX() + targetWidth / 2,
                            safe.centerY() + targetHeight / 2
                        )'''

          old_forced_icon_5dp = '''                        val safe = RectF(r.left + dp(5f), r.top + dp(5f), r.right - dp(5f), r.bottom - dp(5f))
                        val targetAspect = 376f / 288f
                        var targetWidth = safe.width()
                        var targetHeight = targetWidth / targetAspect
                        if (targetHeight > safe.height()) {
                            targetHeight = safe.height()
                            targetWidth = targetHeight * targetAspect
                        }
                        val dst = RectF(
                            safe.centerX() - targetWidth / 2,
                            safe.centerY() - targetHeight / 2,
                            safe.centerX() + targetWidth / 2,
                            safe.centerY() + targetHeight / 2
                        )'''

          natural_icon = '''                        val safe = RectF(r.left + dp(5f), r.top + dp(5f), r.right - dp(5f), r.bottom - dp(5f))
                        val scale = minOf(
                            safe.width() / bitmap.width.toFloat(),
                            safe.height() / bitmap.height.toFloat()
                        )
                        val targetWidth = bitmap.width * scale
                        val targetHeight = bitmap.height * scale
                        val dst = RectF(
                            safe.centerX() - targetWidth / 2,
                            safe.centerY() - targetHeight / 2,
                            safe.centerX() + targetWidth / 2,
                            safe.centerY() + targetHeight / 2
                        )'''

          if old_forced_icon in tail:
              tail = tail.replace(old_forced_icon, natural_icon, 1)
          elif old_forced_icon_5dp in tail:
              tail = tail.replace(old_forced_icon_5dp, natural_icon, 1)
          elif 'val scale = minOf(\n                            safe.width() / bitmap.width.toFloat(),' not in tail:
              raise SystemExit('Expected channel icon rendering block not found.')

          path.write_text(head + tail, encoding='utf-8')
          print('Applied 376x288 channel cards while preserving each icon aspect ratio.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Set channel cards to 376x288 and preserve icons'
          git push
