name: Fix channel card aspect ratio

on:
  push:
    paths:
      - '.github/workflows/fix-channel-icon-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 376x288 channel card ratio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          marker = 'private class ChannelView(context: Context, categoryIndex: Int) : View(context) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('ChannelView declaration not found.')

          head = text[:start]
          tail = text[start:]

          old_row = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val rowHeight = cw + rowGap'''
          new_row = '''        val cw = (width - side * 2 - gap * (columns - 1)) / columns.toFloat()
        val cardHeight = cw * (288f / 376f)
        val rowHeight = cardHeight + rowGap'''

          if old_row not in tail:
              raise SystemExit('Expected ChannelView row sizing block not found.')
          tail = tail.replace(old_row, new_row, 1)

          old_rect = '''                    val r = RectF(left, topPos, left + cw, topPos + cw)'''
          new_rect = '''                    val r = RectF(left, topPos, left + cw, topPos + cardHeight)'''

          if old_rect not in tail:
              raise SystemExit('Expected ChannelView card rectangle block not found.')
          tail = tail.replace(old_rect, new_rect, 1)

          path.write_text(head + tail, encoding='utf-8')
          print('Applied 376x288 channel card ratio to ChannelView.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Set channel cards to 376x288 aspect ratio'
          git push
