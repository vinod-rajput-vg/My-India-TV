name: One-time DPAD down navigation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply navigation fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/myindiatv/MainActivity.kt')
          s = p.read_text()

          old_home = '''            KeyEvent.KEYCODE_DPAD_DOWN -> {
                val currentRow = selected / columns
                val nextRowFirst = (currentRow + 1) * columns
                if (nextRowFirst < names.size) {
                    selected = minOf(names.size - 1, nextRowFirst + columns - 1)
                }
                postInvalidateOnAnimation()
                return true
            }'''
          new_home = '''            KeyEvent.KEYCODE_DPAD_DOWN -> {
                val currentRow = selected / columns
                val nextRowFirst = (currentRow + 1) * columns
                if (nextRowFirst < names.size) {
                    val nextRowLast = minOf(names.size - 1, nextRowFirst + columns - 1)
                    selected = nextRowLast
                }
                postInvalidateOnAnimation()
                return true
            }'''

          old_channel = '''            KeyEvent.KEYCODE_DPAD_DOWN -> {
                val currentRow = selected / columns
                val nextRowFirst = (currentRow + 1) * columns
                if (nextRowFirst <= maxIndex) {
                    selected = minOf(maxIndex, nextRowFirst + columns - 1)
                }
                ensureSelectedVisible()
                postInvalidateOnAnimation()
                return true
            }'''
          new_channel = '''            KeyEvent.KEYCODE_DPAD_DOWN -> {
                val currentRow = selected / columns
                val nextRowFirst = (currentRow + 1) * columns
                if (nextRowFirst <= maxIndex) {
                    val nextRowLast = minOf(maxIndex, nextRowFirst + columns - 1)
                    selected = nextRowLast
                }
                ensureSelectedVisible()
                postInvalidateOnAnimation()
                return true
            }'''

          if old_home not in s:
              raise SystemExit('Home DPAD_DOWN block not found')
          if old_channel not in s:
              raise SystemExit('Channel DPAD_DOWN block not found')

          s = s.replace(old_home, new_home, 1)
          s = s.replace(old_channel, new_channel, 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/one-time-dpad-down-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt .github/workflows/one-time-dpad-down-fix.yml
          git commit -m 'Fix DPAD down navigation for category and channel grids'
          git push
