          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myindiatv/MainActivity.kt
          git rm .github/workflows/update-category-lists.yml
          git commit -m 'Update Entertainment and Imfotainment channels from TXT lists'
          git push
